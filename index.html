<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="四人慢慢旅">
<meta name="theme-color" content="#855B32">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<title>四人慢慢旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：頂欄 + 橫向分頁（總覽 / D1–D5）；總覽有紫色封面卡、路線示意圖、航班住宿、待辦；每日頁是班次卡 + 時間軸卡片 */
/* 配色：橘棕系。#855B32 #B17844 #E9A368 #E98B2A #E79460 #FC9F4D #FFBA84；底色與文字色是用這組顏色調出的淺暖色與深棕 */
:root {
  --bg: #fcf4ec;
  --surface: #fffdfa;
  --ink: #3a2412;
  --muted: #7b5e47;
  --line: #f1dfcf;
  --accent: #855b32;
  --hl: #e98b2a;
  --on-accent: #ffffff;
  --accent-soft: #fdebdc;
  --accent-edge: #e9a368;
  --grad-a: #855b32;
  --grad-m: #b17844;
  --grad-b: #e79460;
  --tag-eat: #b5560f;
  --tag-go: #855b32;
  --tag-move: #7b5e47;
  --font-display: "Chiron GoRound TC", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f150d; --surface: #2c1f14; --ink: #fbefe3; --muted: #cdb199; --line: #483423;
    --accent: #ffba84; --hl: #fc9f4d; --on-accent: #2a1a0c; --accent-soft: #433020; --accent-edge: #b17844;
    --grad-a: #5a3a1c; --grad-m: #855b32; --grad-b: #b17844;
    --tag-eat: #ffb27a; --tag-go: #e9a368; --tag-move: #cdb199; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f150d; --surface: #2c1f14; --ink: #fbefe3; --muted: #cdb199; --line: #483423;
  --accent: #ffba84; --hl: #fc9f4d; --on-accent: #2a1a0c; --accent-soft: #433020; --accent-edge: #b17844;
  --grad-a: #5a3a1c; --grad-m: #855b32; --grad-b: #b17844;
  --tag-eat: #ffb27a; --tag-go: #e9a368; --tag-move: #cdb199; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 12px 56px; }
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
svg.ic { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.125rem; margin: 0; color: var(--accent); text-wrap: balance; }
.btns { display: flex; gap: 8px; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; font: inherit; }
.ibtn svg { width: 18px; height: 18px; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 12px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.25; flex: none; position: relative; }
.tab .d { font-family: var(--font-display); font-weight: 900; font-size: 1rem; }
.tab .w { font-size: .75rem; font-variant-numeric: tabular-nums; }
.tab.over { justify-content: center; font-weight: 700; padding-inline: 14px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab.today::after { content: ""; position: absolute; top: 8px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--hl); }
.tab:focus-visible, a:focus-visible, .ibtn:focus-visible, .chk:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-m) 55%, var(--grad-b) 100%); color: #fff; border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; }
.hero h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.75rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.hmeta { display: flex; flex-direction: column; gap: 6px; font-size: .9375rem; }
.hmeta div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hmeta span { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.nowbox { background: rgba(58,30,8,.30); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.nowbox .eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; opacity: .9; }
.nowbox .big { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; line-height: 1.25; text-wrap: balance; }
.nowbox .sub { font-size: .875rem; }
.nowbox a { color: #fff; font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-family: var(--font-display); font-weight: 900; font-size: 1.0625rem; margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h3 small { font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); }
.mapbox { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--map-bg); }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapnote { font-size: .75rem; color: var(--muted); padding: 6px 12px; background: var(--surface); }
.m-line { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; fill: none; }
.m-line.dash { stroke-dasharray: 2 7; }
.m-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 3; }
.m-name { font-size: 13px; font-weight: 700; fill: var(--ink); font-family: var(--font-body); }
.m-sub { font-size: 11px; fill: var(--muted); font-family: var(--font-display); font-weight: 700; }
.m-grid { stroke: var(--map-grid); stroke-width: 1; }

.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.todo label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer; min-width: 0; }
.chk { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.todo span { min-width: 0; overflow-wrap: anywhere; }
.todo input:checked + span { color: var(--muted); text-decoration: line-through; }
.hint { font-size: .75rem; color: var(--muted); margin: 0; }

.kv { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 2px 12px; font-size: .9375rem; }
.kv dt { color: var(--muted); font-size: .8125rem; padding-top: 2px; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.fl { display: flex; flex-direction: column; gap: 2px; padding-block: 4px; }
.fl + .fl { border-top: 1px solid var(--line); padding-top: 10px; }
.fl .a { font-size: .75rem; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.fl .b { font-family: var(--font-display); font-weight: 900; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.fl .c { font-size: .8125rem; color: var(--muted); }
.res { display: flex; flex-direction: column; gap: 2px; font-size: .9375rem; }
.res .p { font-size: .8125rem; color: var(--muted); }

.dlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.dbtn { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: 2px 10px; cursor: pointer; }
.dbtn .n { font-family: var(--font-display); font-weight: 900; color: var(--accent); font-size: 1.125rem; grid-row: span 2; align-self: center; }
.dbtn .t { font-weight: 700; overflow-wrap: anywhere; }
.dbtn .s { font-size: .8125rem; color: var(--muted); overflow-wrap: anywhere; }

.dayhead h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.375rem; margin: 0; text-wrap: balance; }
.dayhead h2 em { font-style: normal; color: var(--accent); margin-right: 8px; }
.dayhead p { margin: 2px 0 0; color: var(--muted); font-size: .875rem; }
.dayhead .dt { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stay { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.stay .lab { font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.stay .nm { font-weight: 700; overflow-wrap: anywhere; }
.stay .ad { color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }

.alts { display: flex; flex-direction: column; gap: 12px; }
.alts .g { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.alts .gl { font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.alts .r { display: grid; grid-template-columns: minmax(0, 1fr) auto 2rem; gap: 8px; font-size: .9375rem; align-items: baseline; }
.alts .tm { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.alts .bd { font-size: .75rem; font-weight: 700; text-align: center; border-radius: 6px; padding: 0 2px; }
.alts .bd.m { background: var(--accent); color: var(--on-accent); }
.alts .bd.b { border: 1px solid var(--line); color: var(--muted); }
.alts.inl { margin-top: 6px; gap: 4px; }

ol.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.stop { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: 4px 12px; }
.stop.next { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.time { font-family: var(--font-display); font-weight: 900; font-size: 1rem; font-variant-numeric: tabular-nums; padding-top: 1px; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font-weight: 700; font-size: 1.0625rem; overflow-wrap: anywhere; }
.jp { color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
.note { font-size: .9375rem; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; }
.tag { font-size: .75rem; font-weight: 700; letter-spacing: .06em; }
.tag.eat { color: var(--tag-eat); } .tag.go { color: var(--tag-go); } .tag.move { color: var(--tag-move); }
.hrs { font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.map { font-size: .875rem; font-weight: 700; color: var(--accent); text-underline-offset: 3px; }
.flag { grid-column: 1 / -1; font-size: .75rem; color: var(--accent); font-weight: 700; }
.sample { border: 1px dashed var(--muted); border-radius: 12px; padding: 8px 12px; font-size: .8125rem; color: var(--muted); }
footer { color: var(--muted); font-size: .75rem; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .875rem; z-index: 9; }

.card.stay { flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.m-line.off { opacity: .18; }
g.off { opacity: .35; }
.kv dd.na { color: var(--muted); }
.dayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dayhead .dt { text-align: right; line-height: 1.25; flex: none; }
ol.stops { gap: 0; }
.stop { display: grid; grid-template-columns: 3.25rem 30px minmax(0, 1fr); gap: 0 10px; position: relative; padding: 0 0 14px; background: none; border: 0; box-shadow: none; border-radius: 0; }
.stop::before { content: ""; position: absolute; left: calc(3.25rem + 10px + 14px); top: 32px; bottom: 2px; border-left: 2px dashed var(--line); }
.stop:last-child::before { display: none; }
.stop.next { border: 0; box-shadow: none; }
.stop.next .ico { background: var(--hl); color: #2a1a0c; }
.stop.next .time { color: var(--hl); }
.ico { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; position: relative; z-index: 1; }
.ico svg { width: 16px; height: 16px; }
.time { padding-top: 5px; font-size: .9375rem; }
.body { padding-top: 3px; }
.body.cardy { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stop.next .body.cardy { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl); }
.flag { margin-top: 2px; }

.wx { gap: 4px; }
.wxh { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); font-size: .875rem; }
.wxh .src { margin-left: auto; font-size: .75rem; font-weight: 400; color: var(--muted); }
.wi { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font-size: .9375rem; }
.wi .deg { font-family: var(--font-display); font-weight: 900; font-variant-numeric: tabular-nums; }
.wi .wd { font-size: .8125rem; color: var(--muted); }
.tip { font-size: .8125rem; color: var(--muted); }
.wrow { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: 10px; align-items: start; border-top: 1px solid var(--line); padding-top: 8px; }
.wrow:first-child { border-top: 0; padding-top: 0; }
.wrow .n { font-family: var(--font-display); font-weight: 900; color: var(--accent); font-size: 1.0625rem; }
.wr { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wr .s { font-size: .8125rem; color: var(--muted); }

.card h3 svg.ic { color: var(--accent); align-self: center; }
.wsrc { margin-left: auto; }
.wxs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.wxc { flex: 1 0 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid var(--accent-edge); border-radius: 16px; padding: 10px 6px; text-align: center; background: var(--bg); min-width: 0; }
.wxc .wp { font-size: .75rem; color: var(--muted); }
.wxc .wdt { font-size: .8125rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.wxi { width: 36px; height: 36px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-block: 4px; }
.wxc .wt b { font-family: var(--font-display); font-weight: 900; font-size: 1.125rem; }
.wxc .wt small { font-size: .8125rem; color: var(--muted); }
.wxc .ws { font-size: .75rem; }
.wxc .wr2 { font-size: .75rem; color: var(--muted); }
.wxc .w2 { font-size: .6875rem; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 4px; }
#view { width: 100%; min-width: 0; }
.wxs { min-width: 0; max-width: 100%; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--accent-soft); border-radius: 14px; padding: 4px; }
.sb { font: inherit; font-weight: 700; border: 0; border-radius: 10px; background: none; color: var(--muted); padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.sb small { font-weight: 400; font-size: .6875rem; }
.sb[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.note-box { border: 1px dashed var(--muted); border-radius: 12px; padding: 8px 12px; font-size: .875rem; color: var(--muted); }
.note-box.warn { border-color: var(--hl); color: var(--ink); }
.bigsum { font-family: var(--font-display); font-weight: 900; font-size: 2rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.twd { font-size: .875rem; color: var(--muted); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.plist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; font-size: .9375rem; font-variant-numeric: tabular-nums; align-items: baseline; }
.plist .pos { color: var(--tag-go); } .plist .neg { color: var(--tag-eat); }
.setrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; border-top: 1px solid var(--line); padding-top: 10px; }
.setrow label, .lf label { display: flex; flex-direction: column; gap: 3px; font-size: .8125rem; color: var(--muted); min-width: 0; }
.setrow input { width: 8.5rem; }
.lf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lf .wide, .lf .btn { grid-column: 1 / -1; }
input[type="number"], input[type="text"], input[type="date"], select { font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; width: 100%; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); padding: 10px 14px; cursor: pointer; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: .5; }
.elist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.elist .dh { font-size: .75rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; padding: 10px 0 4px; font-variant-numeric: tabular-nums; }
.elist .dh:first-child { padding-top: 0; }
.er { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 2rem; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.er .cc { font-size: .75rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 2px 8px; }
.er .ei { display: flex; flex-direction: column; min-width: 0; }
.er .ei b { overflow-wrap: anywhere; }
.er .en { font-size: .8125rem; color: var(--muted); overflow-wrap: anywhere; }
.er .ea { font-family: var(--font-display); font-weight: 900; font-variant-numeric: tabular-nums; }
.del { font: inherit; font-size: 1.25rem; line-height: 1; border: 0; background: none; color: var(--muted); cursor: pointer; width: 2rem; height: 2rem; border-radius: 50%; }
.empty { color: var(--muted); font-size: .9375rem; }
input:focus-visible, select:focus-visible, .btn:focus-visible, .sb:focus-visible, .del:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.bar { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar i.warn { background: var(--hl); } .bar i.over { background: var(--tag-eat); }
.cstat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cstat li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto 2.5rem; gap: 8px; align-items: center; font-size: .9375rem; }
.cstat b { font-variant-numeric: tabular-nums; } .cstat small { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.plist li { grid-template-columns: minmax(0, 1fr) auto auto; } .plist .sub { font-size: .75rem; color: var(--muted); text-align: right; }
.tfr { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.tfr .gl { font-size: .75rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.tfr .tr { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.btnrow { display: flex; gap: 8px; } .btnrow .btn { flex: 1; }
.hbtns { display: flex; gap: 6px; margin-left: auto; }
.hbtns .btn.sm { margin-left: 0; }
.btn.sm { padding: 4px 10px; font-size: .8125rem; margin-left: auto; }
.card h3 .btn.sm { font-family: var(--font-body); }
.chips { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chips legend { font-size: .8125rem; color: var(--muted); padding: 0; margin-bottom: 4px; }

    const subs = [];
    const parentOf = p => p.slice(0, p.lastIndexOf("/"));
    const notify = p => subs.forEach(f => { if (f.path === p || f.path === parentOf(p)) f.run(); });

function mapSvg(route) {
  const W = 400, H = 300, lo0 = 136.55, lo1 = 137.5, la0 = 34.7, la1 = 36.45;
  const P = k => ({ x: 30 + (PLACES[k].lon - lo0) / (lo1 - lo0) * (W - 60), y: 30 + (la1 - PLACES[k].lat) / (la1 - la0) * (H - 60) });
  const on = k => !route || route.indexOf(k) >= 0;
  const legOn = (a, b) => { if (!route) return true; for (let i = 0; i < route.length - 1; i++) { if ((route[i] === a && route[i+1] === b) || (route[i] === b && route[i+1] === a)) return true; } return false; };
  let g = "";
  for (let i = 1; i < 8; i++) g += '<line class="m-grid" x1="' + (W/8*i) + '" y1="0" x2="' + (W/8*i) + '" y2="' + H + '"/>';
  for (let i = 1; i < 6; i++) g += '<line class="m-grid" x1="0" y1="' + (H/6*i) + '" x2="' + W + '" y2="' + (H/6*i) + '"/>';
  ROUTES.forEach(r => { const a = P(r[0]), b = P(r[1]); g += '<line class="m-line' + (r[2] ? ' dash' : '') + (legOn(r[0], r[1]) ? '' : ' off') + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"/>'; });
  Object.keys(PLACES).forEach(k => {
    const p = P(k), c = PLACES[k], left = c.side === "l", tx = p.x + (left ? -12 : 12), an = left ? "end" : "start";
    g += '<g class="' + (on(k) ? '' : 'off') + '"><circle class="m-dot" cx="' + p.x + '" cy="' + p.y + '" r="7"/>' +
      '<text class="m-name" x="' + tx + '" y="' + (p.y - 1) + '" text-anchor="' + an + '">' + esc(c.name) + '</text>' +
      '<text class="m-sub" x="' + tx + '" y="' + (p.y + 13) + '" text-anchor="' + an + '">' + esc(c.sub) + '</text></g>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="路線示意圖">' + g + '</svg>';
}

function calc(rows, pub) {
  const r = { total: 0, cat: {}, paid: {}, share: {}, net: {}, transfers: [] };
  rows.forEach(e => {
    const a = Number(e.amount) || 0; r.total += a; r.cat[e.cat || "其他"] = (r.cat[e.cat || "其他"] || 0) + a;
    if (!pub) return;
    const sp = splitOf(e), py = who(e.payer); if (py) { r.paid[py] = (r.paid[py] || 0) + a; r.net[py] = (r.net[py] || 0) + a; }
    sp.forEach(id => { r.share[id] = (r.share[id] || 0) + a / sp.length; r.net[id] = (r.net[id] || 0) - a / sp.length; });
  });
  const cr = [], de = [];
  Object.keys(r.net).forEach(id => { const v = Math.round(r.net[id]); if (v > 0) cr.push([id, v]); else if (v < 0) de.push([id, -v]); });
  cr.sort((a, b) => b[1] - a[1]); de.sort((a, b) => b[1] - a[1]);
  while (cr.length && de.length) { const m = Math.min(cr[0][1], de[0][1]); r.transfers.push([de[0][0], cr[0][0], m]); cr[0][1] -= m; de[0][1] -= m; if (!cr[0][1]) cr.shift(); if (!de[0][1]) de.shift(); }

}

      '<fieldset class="wide chips"><legend>分攤的人</legend>' + ppl.map(id => '<label class="chip"><input type="checkbox" class="f-sp" value="' + esc(id) + '"' + (chosen.indexOf(id) >= 0 ? " checked" : "") + '><span>' + esc(who(id)) + '</span></label>').join("") + '</fieldset>' : '') +
    '<label class="wide">備註（選填）<input id="f-n" type="text" maxlength="80" value="' + esc(ed ? v.note : "") + '"></label>' +
    '<div class="wide btnrow"><button class="btn" id="f-b" type="submit">' + (ed ? "儲存修改" : "新增") + '</button>' + (ed ? '<button class="btn ghost" id="f-x" type="button">取消</button>' : '') + '</div></form>';
  if (prev) { ["f-a", "f-t", "f-c", "f-d", "f-n"].forEach(k => { if (prev[k] != null && $(k)) $(k).value = prev[k]; }); }
  $("l-f").addEventListener("submit", saveEntry);
  const x = $("f-x"); if (x) x.addEventListener("click", () => { L.edit = null; ledgerRefresh(); });
}

function startEdit(id) {
  const e = (L.mode === "pub" ? L.pub : L.mine).find(r => r.id === id); if (!e) return;
  L.edit = e; L.formKey = ""; ledgerRefresh();
  const f = $("l-form"); if (f && f.scrollIntoView) { try { f.scrollIntoView({ block: "center" }); } catch (x) {} }
}

async function saveEntry(ev) {
  ev.preventDefault();
  if (!L.db || L.busy) return;
  const pub = L.mode === "pub", amount = Math.round(Number($("f-a").value)), title = $("f-t").value.trim();
  if (!(amount > 0) || !title) { L.msg = "請填金額和項目。"; ledgerRefresh(); return; }
  const data = { amount, title, cat: $("f-c").value, date: $("f-d").value || todayStr(), note: $("f-n").value.trim() };
  if (pub) {
    data.payer = $("f-p").value; data.split = Array.from(document.querySelectorAll(".f-sp")).filter(x => x.checked).map(x => x.value);
    if (!data.split.length) { L.msg = "至少要選一位分攤的人。"; ledgerRefresh(); return; }
  }
  const ed = L.edit;
  data.createdAt = ed && ed.createdAt ? ed.createdAt : Date.now(); if (pub) data.by = ed && ed.by ? ed.by : myId();
  L.busy = true; $("f-b").disabled = true; L.msg = "";
  try {
    if (!myId()) throw { code: "no_id" };
    const col = pub ? L.db.collection("ledger") : L.db.collection("data/users/" + myId());
    if (ed) await col.doc(ed.id).set(data); else await col.add(data);
    L.edit = null; L.formKey = "";
  } catch (e) { L.msg = (e && (e.code === "invalid_argument" || e.code === "no_id")) ? "沒有記帳權限，請建立者在「分享」把你設為協作者。" : "儲存失敗，請稍後再試（" + ((e && e.code) || "未知") + "）。"; if (e && e.code === "invalid_argument") L.canWrite = false; }
  L.busy = false; if (!L.edit) { ["f-a", "f-t", "f-n"].forEach(k => { const el = $(k); if (el) el.value = ""; }); }
  ledgerRefresh(); const b = $("f-b"); if (b) b.disabled = false;
}

async function delEntry(id) {
  if (!L.db) return;
  try {
    if (L.mode === "pub") await L.db.collection("ledger").doc(id).delete(); else await L.db.collection("data/users/" + myId()).doc(id).delete();
    if (L.edit && L.edit.id === id) { L.edit = null; L.formKey = ""; }
  } catch (e) { L.msg = "刪除失敗（" + ((e && e.code) || "未知") + "）。"; ledgerRefresh(); }
}

async function saveSettings() {
  if (!L.db) return;
  const b = Math.round(Number($("s-b").value)) || 0, r = Number($("s-r").value) || 0;
  const ppl = L.mode === "pub" ? $("s-p").value.split(/[,，、\s]+/).map(x => x.trim()).filter(Boolean) : null;
  try {
    const needMeta = (L.mode === "pub" && (b !== (Number(L.meta.budget) || 0) || ppl.join("|") !== peopleList().join("|"))) || r !== (Number(L.meta.rate) || 0);
    if (needMeta) { const body = Object.assign({}, L.meta); if (r > 0) body.rate = r; else delete body.rate; if (L.mode === "pub") { if (b > 0) body.budget = b; else delete body.budget; if (ppl.length) body.people = Array.from(new Set(ppl)); } await L.db.doc("meta/settings").set(body); }
    if (L.mode === "me" && b !== (Number(L.myBudget) || 0) && myId()) await L.db.collection("data/users/" + myId()).doc("_budget").set({ budget: b });
    L.msg = "";
  } catch (e) { L.msg = "設定儲存失敗，可能沒有權限。"; }
  ledgerRefresh();
}

async function exportBrief(rows, c) {
  if (!L.dl) return;
  const rate = fxRate(), people = Array.from(new Set(peopleList().concat(Object.keys(c.net))));
  const t = n => rate ? "約 NT$ " + Math.round(n * rate).toLocaleString("zh-TW") : "";
  const W = 720, PAD = 36, SC = 2, FONT = "'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif";
  const INK = "#3A2412", MUTED = "#7B5E47", LINE = "#F1DFCF", ACC = "#855B32", SOFT = "#FDEBDC", POS = "#2F7D4F", NEG = "#B5560F";
  const probe = document.createElement("canvas").getContext("2d");
  const fit = (txt, font, max) => { probe.font = font; if (probe.measureText(txt).width <= max) return txt; let x = txt; while (x.length > 1 && probe.measureText(x + "…").width > max) x = x.slice(0, -1); return x + "…"; };
  const wrap = (txt, font, max) => { probe.font = font; const out = []; let cur2 = ""; for (const ch of String(txt)) { if (probe.measureText(cur2 + ch).width > max && cur2) { out.push(cur2); cur2 = ch; } else cur2 += ch; } if (cur2) out.push(cur2); return out; };
  const det = rows.slice().reverse();
  // layout pass: list of draw ops with y
  const ops = []; let y = 0;
  const T = (txt, x, size, color, weight, align) => ops.push({ k: "t", txt, x, y, size, color, weight: weight || 400, align: align || "left" });
  y = 0; ops.push({ k: "head" }); y = 136;
  T("公帳總計", PAD, 20, MUTED, 600); y += 56; T(yen(c.total), PAD, 44, ACC, 800); if (rate) T(t(c.total), W - PAD, 20, MUTED, 500, "right"); y += 30;
  y += 18; T("每個人", PAD, 20, INK, 800); y += 14;
  people.forEach(id => { y += 44; const n = Math.round(c.net[id] || 0);
    T(id, PAD, 22, INK, 700); T("先付 " + yen(c.paid[id] || 0) + "　應分攤 " + yen(c.share[id] || 0), PAD + 120, 18, MUTED, 400);
    T((n >= 0 ? "應收 " : "應付 ") + yen(Math.abs(n)), W - PAD, 22, n >= 0 ? POS : NEG, 800, "right"); });
  y += 28; ops.push({ k: "line", y });
  y += 38; T("建議這樣結清", PAD, 20, INK, 800);
  if (c.transfers.length) c.transfers.forEach(x => { y += 48; ops.push({ k: "box", y: y - 30, h: 44 }); T(x[0] + "  →  " + x[1], PAD + 14, 22, INK, 700); T(yen(x[2]) + (rate ? "（" + t(x[2]) + "）" : ""), W - PAD - 14, 22, ACC, 800, "right"); y += 4; });
  else { y += 40; T("目前已經結清 🎉".replace(" 🎉", ""), PAD, 20, MUTED, 400); }
  y += 30; ops.push({ k: "line", y });
  y += 38; T("明細（" + det.length + " 筆）", PAD, 20, INK, 800);
  let day = "";
  det.forEach(r => {
    if (r.date !== day) { day = r.date; y += 40; T(String(r.date || ""), PAD, 17, MUTED, 700); }
    y += 36;
    const left = fit((r.cat ? "[" + r.cat + "] " : "") + (r.title || ""), "600 20px " + FONT, 400);
    T(left, PAD, 20, INK, 600); T(yen(Number(r.amount) || 0), W - PAD, 20, INK, 700, "right");
    const info = who(r.payer) + " 先付｜分攤：" + splitOf(r).join("、") + (r.note ? "｜" + r.note : "");
    wrap(info, "400 16px " + FONT, W - PAD * 2).forEach(line => { y += 24; T(line, PAD, 16, MUTED, 400); });
  });
  y += 36; T("整理時間 " + new Date().toLocaleString("zh-TW"), PAD, 15, MUTED, 400);
  const H = y + 30;
  const cv = document.createElement("canvas"); cv.width = W * SC; cv.height = H * SC;
  const g = cv.getContext("2d"); g.scale(SC, SC);
  g.fillStyle = "#FFFDFA"; g.fillRect(0, 0, W, H);
  ops.forEach(o => {
    if (o.k === "head") { const gr = g.createLinearGradient(0, 0, W, 100); gr.addColorStop(0, "#855B32"); gr.addColorStop(1, "#E79460"); g.fillStyle = gr; g.fillRect(0, 0, W, 100);
      g.fillStyle = "#fff"; g.textBaseline = "alphabetic"; g.textAlign = "left"; g.font = "800 30px " + FONT; g.fillText("名古屋旅行 公帳摘要", PAD, 58); g.font = "400 16px " + FONT; g.globalAlpha = .85; g.fillText("2026/11/5 – 11/9", PAD, 84); g.globalAlpha = 1; }
    else if (o.k === "line") { g.fillStyle = LINE; g.fillRect(PAD, o.y, W - PAD * 2, 2); }
    else if (o.k === "box") { g.fillStyle = SOFT; g.beginPath(); g.roundRect ? g.roundRect(PAD, o.y, W - PAD * 2, o.h, 10) : g.rect(PAD, o.y, W - PAD * 2, o.h); g.fill(); }
    else { g.fillStyle = o.color; g.textAlign = o.align; g.font = o.weight + " " + o.size + "px " + FONT; g.fillText(o.txt, o.x, o.y); }
  });
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if (!blob) { L.msg = "無法產生圖片，請稍後再試。"; ledgerRefresh(); return; }
  try { await L.dl.save({ filename: "名古屋公帳摘要.png", data: blob }); }
  catch (e) { if (!e || e.code !== "declined") { L.msg = "無法儲存圖片，請稍後再試。"; ledgerRefresh(); } }
}

async function exportCsv(rows, pub) {
  if (!L.dl) return;
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = pub ? ["日期", "類別", "項目", "金額(JPY)", "付款人", "分攤者", "備註"] : ["日期", "類別", "項目", "金額(JPY)", "備註"];
  const lines = [head.map(q).join(",")].concat(rows.slice().reverse().map(r => (pub ? [r.date, r.cat, r.title, r.amount, who(r.payer), splitOf(r).join("、"), r.note] : [r.date, r.cat, r.title, r.amount, r.note]).map(q).join(",")));
  try { await L.dl.save({ filename: pub ? "名古屋公帳.csv" : "名古屋個人帳.csv", data: "﻿" + lines.join("\r\n") }); }
  catch (e) { if (!e || e.code !== "declined") { L.msg = "無法匯出，請稍後再試。"; ledgerRefresh(); } }
}

renderTabs(); (cur < 0 ? renderOverview : cur === 99 ? renderLedger : renderDay)();
initLedger();
</script>
